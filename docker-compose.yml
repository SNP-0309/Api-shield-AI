version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: api-shield-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: api-shield-ml
    restart: unless-stopped
    environment:
      - PORT=8000
      - MODEL_PATH=./models/model.pkl
      - SCALER_PATH=./models/scaler.pkl
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api-shield-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - SENTINEL_API_KEYS=${SENTINEL_API_KEYS:?Set SENTINEL_API_KEYS before starting the stack}
      - SENTINEL_ADMIN_API_KEY=${SENTINEL_ADMIN_API_KEY:-}
      - UPSTREAM_URL=${UPSTREAM_URL:-}
      - ALLOW_IN_MEMORY_FALLBACK=false
      - TRUST_PROXY=${TRUST_PROXY:-0}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:5000
        VITE_SENTINEL_API_KEY: ${SENTINEL_ADMIN_API_KEY:-}
    container_name: api-shield-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:
